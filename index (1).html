rgin-bottom:2mm}.label{display:block;margin-bottom:.5mm;color:rgba(255,255,255,.6);font-size:1.5mm;font-weight:700;text-transform:uppercase;letter-spacing:.25mm}.value{display:block;color:var(--text);font-size:var(--detail-size);line-height:1.1;font-weight:700;overflow-wrap:anywhere;text-decoration:none}.value:hover{text-decoration:underline;text-underline-offset:1px}.socials{display:flex;gap:1mm;padding-top:1.2mm;border-top:1px solid var(--line)}.social{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:2mm;color:#fff;text-decoration:none}.social svg{width:4.2mm;height:4.2mm;fill:currentColor}.social:hover{background:rgba(255,255,255,.1)}.social:focus-visible,.value:focus-visible,.print:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(238,58,35,.65)}.print{min-height:44px;padding:12px 20px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:700 15px Arial,Helvetica,sans-serif;cursor:pointer;box-shadow:0 8px 18px rgba(238,58,35,.2)}.print:hover{filter:brightness(.95)}@media(max-width:520px){body{padding:14px}.card{transform:none!important;max-width:calc(100vw - 28px);max-height:calc((100vw - 28px)*.6308)}}@media(prefers-reduced-motion:reduce){.card{transition:none!important;transform:none!important}}@media print{@page{size:auto;margin:0}html,body{margin:0;padding:0;background:#fff}body{display:block}.stage{width:var(--card-w);height:var(--card-h)}.card{width:var(--card-w);height:var(--card-h);box-shadow:none;transform:none!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}.print{display:none!important}}

<script>

const photo=document.getElementById('photo'),fallback=document.getElementById('fallback');photo.addEventListener('error',()=>{photo.style.display='none';fallback.style.display='flex'});
/* ===== Subtle mouse tilt ===== */
const card=document.getElementById('card'),reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)');card.addEventListener('mousemove',e=>{if(reducedMotion.matches||window.matchMedia('(max-width:520px)').matches)return;const r=card.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;card.style.transform=`rotateX(${(.5-y)*5}deg) rotateY(${(x-.5)*5}deg)`});card.addEventListener('mouseleave',()=>card.style.transform='rotateX(0deg) rotateY(0deg)');
